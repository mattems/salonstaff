# Weekly updates for the GitHub Actions the workflows use, grouped into one
# pull request.
version: 2
updates:
  # Our packages (bun) are not listed: Dependabot can't read this repo's lockfile
  # format yet ("Unsupported bun.lock lockfileVersion 2", 2026-10-02). Add a
  # `bun` entry back when it can.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci(deps)
  # The mobile app is its own npm project with a lockfile Dependabot can read.
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
      day: monday
    groups:
      mobile:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)
