# Secret scanning (gitleaks), run in CI on every pull request. GitHub's own
# secret scanning isn't available on a private repository on the free plan.
title = "salonstaff"

[extend]
useDefault = true

[[allowlists]]
description = "Things that look like keys but are public by design"
regexTarget = "line"
regexes = [
  # The Cloudflare Access audience tag identifies an application; it grants nothing.
  '''"ACCESS_AUD":''',
  # A made-up secret for the sign-in library in a test (apps/api/test/hardening.test.ts).
  '''secret: "a-test-secret-that-is-long-enough-000"''',
]
